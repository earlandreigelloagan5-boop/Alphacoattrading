<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Label maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Besley:wght@500..900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px; background: #333; color: #fff; font: 16px Archivo, sans-serif; }
  canvas { display: block; width: 100%; max-width: 1400px; margin-bottom: 12px; }
  .warm { font-family: Besley; font-weight: 900; }
</style>
</head>
<body>
<p id="status">Drawing labels…</p>
<span class="warm">ALPHACOAT</span>
<script>
/*
  Draws the wrap-around can labels and saves them to ./textures through save_server.py.
  The label is 2816 x 800: one full turn of the can, with the front panel in the middle.
*/
const W = 2816, H = 800, CX = W / 2;

const VARIANTS = [
  { id: '3130',       code: '3130', lines: ['Epoxy Zinc Rich', 'Primer'] },
  { id: 'thinner-10', code: '#10',  lines: ['Lacquer', 'Thinner'] },
  { id: 'thinner-40', code: '#40',  lines: ['Polyurethane', 'Reducer'] },
  { id: 'topcoat',    code: '',     lines: ['Topcoat'] }
];

function leaf(ctx, cx, cy, d) {
  const s = d / 32;
  ctx.save();
  ctx.translate(cx - d / 2, cy - d / 2);
  ctx.scale(s, s);
  ctx.beginPath(); ctx.arc(16, 16, 15, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#2fa35b';
  ctx.fill(new Path2D('M8.6 21.6C8 13.9 13.6 8.9 23.6 9.6c.9 8.3-5 13.9-15 12Z'));
  ctx.strokeStyle = '#0a4a2a'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.stroke(new Path2D('M9.4 21c3.6-4.2 7.8-7.6 13-10.4'));
  ctx.restore();
}

function draw(v) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#060606';
  ctx.fillRect(0, 0, W, H);

  // Front panel
  leaf(ctx, CX, 116, 122);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '900 110px Besley';
  ctx.letterSpacing = '5px';
  ctx.fillText('ALPHACOAT', CX, 300);
  ctx.letterSpacing = '0px';

  const rule = ctx.createLinearGradient(CX - 330, 0, CX + 330, 0);
  rule.addColorStop(0, '#d23a2e'); rule.addColorStop(.38, '#2b4fa8');
  rule.addColorStop(.68, '#e39a1f'); rule.addColorStop(1, '#2fa35b');
  ctx.fillStyle = rule;
  ctx.fillRect(CX - 330, 326, 660, 9);

  ctx.fillStyle = '#fff';
  ctx.font = '700 43px Besley';
  ctx.fillText('Trading & Paint Services', CX, 392);

  // Green band, all the way round
  ctx.fillStyle = '#0f6b3c';
  ctx.fillRect(0, 452, W, 218);
  ctx.fillStyle = '#fff';

  if (v.code) {
    ctx.font = '900 132px Besley';
    const codeW = ctx.measureText(v.code).width;
    ctx.font = '650 47px Archivo';
    const linesW = Math.max(...v.lines.map((t) => ctx.measureText(t).width));
    const gap = 34;
    const left = CX - (codeW + gap + linesW) / 2;

    ctx.textAlign = 'left';
    ctx.font = '900 132px Besley';
    ctx.fillText(v.code, left, 608);
    ctx.font = '650 47px Archivo';
    v.lines.forEach((t, i) => ctx.fillText(t, left + codeW + gap, 548 + i * 60));
  } else {
    ctx.textAlign = 'center';
    ctx.font = '900 124px Besley';
    ctx.fillText(v.lines[0], CX, 604);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9aa39d';
  ctx.font = '500 35px Archivo';
  ctx.fillText('1 gallon', CX, 742);

  return c;
}

(async () => {
  const status = document.getElementById('status');
  try {
    await Promise.all([
      document.fonts.load('900 110px Besley'), document.fonts.load('700 43px Besley'),
      document.fonts.load('650 47px Archivo'), document.fonts.load('500 35px Archivo')
    ]);
    await document.fonts.ready;
    const saved = [];
    for (const v of VARIANTS) {
      const c = draw(v);
      document.body.appendChild(c);
      const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
      const r = await fetch('/save/label-' + v.id + '.png', { method: 'POST', body: blob });
      saved.push(v.id + ':' + r.status + ':' + blob.size);
    }
    status.textContent = 'done ' + saved.join(' ');
    document.title = 'Labels saved';
  } catch (err) {
    status.textContent = 'error ' + err.message;
    document.title = 'Label error';
  }
})();
</script>
</body>
</html>
